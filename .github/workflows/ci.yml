name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · lint · test · build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # нужно только шагу Bootstrap snapshots, чтобы закоммитить снапшоты в main
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format
        run: npx prettier --check .
      # Если снапшотов seed 1–3 ещё нет, Vitest в CI их не создаёт и падает.
      # Этот шаг создаёт их; в main — коммитит (это не запускает CI повторно).
      - name: Bootstrap snapshots
        if: hashFiles('src/testing/random/__snapshots__/**') == ''
        run: |
          npx vitest run -u src/testing/random/random.test.ts
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/testing/random/__snapshots__
            git commit -m "test: снапшоты seed 1–3 (созданы CI при первом прогоне)"
            git push
          fi
      - name: Unit tests
        run: npm run test -- --reporter=default --reporter=github-actions
      - name: Build
        run: npm run build

  e2e:
    name: e2e (Playwright)
    runs-on: ubuntu-24.04
    needs: check
    timeout-minutes: 15
    permissions:
      # нужно только шагу Publish screenshots
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E
        run: npm run e2e
      # Скриншоты из tests/e2e/screens.spec.ts — в отдельную ветку, чтобы смотреть без артефактов
      - name: Publish screenshots
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if ls screens/*.png >/dev/null 2>&1; then
            mkdir -p /tmp/screens && cp screens/*.png /tmp/screens/
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout -q --orphan ci-screens
            git rm -rfq .
            cp /tmp/screens/*.png .
            git add -- *.png
            git commit -qm "screens: ${GITHUB_SHA::7}"
            git push -qf origin ci-screens
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
